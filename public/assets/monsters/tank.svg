<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- ขาสั้นหนา -->
  <rect x="34" y="96" width="18" height="12" rx="5" fill="#0b0f2a" stroke="#a855f7" stroke-width="2.5"/>
  <rect x="76" y="96" width="18" height="12" rx="5" fill="#0b0f2a" stroke="#a855f7" stroke-width="2.5"/>
  <!-- ลำตัวเกราะ -->
  <rect x="20" y="34" width="88" height="66" rx="16" fill="#0b0f2a" stroke="#a855f7" stroke-width="3.5" filter="url(#glow)"/>
  <!-- แผ่นเกราะ -->
  <line x1="20" y1="56" x2="108" y2="56" stroke="#a855f7" stroke-width="2" opacity="0.6"/>
  <line x1="44" y1="34" x2="44" y2="100" stroke="#a855f7" stroke-width="2" opacity="0.6"/>
  <!-- งา -->
  <path d="M38 88 l-6 12" stroke="#a855f7" stroke-width="4" stroke-linecap="round"/>
  <path d="M90 88 l6 12" stroke="#a855f7" stroke-width="4" stroke-linecap="round"/>
  <!-- ตาเล็ก -->
  <circle cx="52" cy="70" r="7" fill="#ffffff"/>
  <circle cx="76" cy="70" r="7" fill="#ffffff"/>
  <circle cx="53" cy="72" r="3" fill="#0b0f2a"/>
  <circle cx="77" cy="72" r="3" fill="#0b0f2a"/>
</svg>
