<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>Preview — Sprite sheet มอนสเตอร์</title>
<style>
  body { background: #0b0f2a; color: #e6e9ff; font-family: 'Sarabun','Leelawadee UI',Tahoma,sans-serif; padding: 20px; }
  h1 { color: #00e5ff; }
  .monster-row { margin-bottom: 24px; }
  .monster-title { margin: 8px 0; font-weight: bold; }
  .frames { display: flex; gap: 8px; flex-wrap: wrap; }
  .frame { text-align: center; }
  .frame canvas { border: 1px solid rgba(255,255,255,.25); border-radius: 6px; background: #000; image-rendering: pixelated; }
  .frame-label { font-size: 11px; color: #9aa0c8; margin-top: 4px; }
  .note { color: #9aa0c8; font-size: 12px; margin-top: 20px; line-height: 1.6; }
</style>
</head>
<body>
<h1>👾 Preview — monsters-sheet.png (384×256, เซลล์ 64×64)</h1>
<p class="note">เฟรม: เดิน-1 · เดิน-2 · ระเบิด-1 · ระเบิด-2 · ระเบิด-3 · เป็นมิตร — โหลดจาก <code>public/assets/sprites/monsters-sheet.png</code></p>
<div id="root"></div>

<script>
  const SHEET = '__SHEET_B64__';
  const CELL = 64, SCALE = 3;
  const ROWS = [
    { id: 'walker', name: '👾 Walker (แม่กก) — เขียว', frames: ['เดิน-1','เดิน-2','ระเบิด-1','ระเบิด-2','ระเบิด-3','เป็นมิตร'] },
    { id: 'runner', name: '🏃 Runner (แม่กด) — ชมพู', frames: ['เดิน-1','เดิน-2','ระเบิด-1','ระเบิด-2','ระเบิด-3','เป็นมิตร'] },
    { id: 'tank',   name: '🛡️ Tank (แม่กบ) — ม่วง', frames: ['เดิน-1','เดิน-2','ระเบิด-1','ระเบิด-2','ระเบิด-3','เป็นมิตร'] },
    { id: 'boss',   name: '👑 Boss (แม่กน) — แดง', frames: ['เดิน-1','เดิน-2','ระเบิด-1','ระเบิด-2','ระเบิด-3','เป็นมิตร'] },
  ];

  const img = new Image();
  img.onload = () => {
    const root = document.getElementById('root');
    ROWS.forEach((row, ri) => {
      const section = document.createElement('div');
      section.className = 'monster-row';
      const title = document.createElement('div');
      title.className = 'monster-title';
      title.textContent = row.name;
      section.appendChild(title);

      const frames = document.createElement('div');
      frames.className = 'frames';
      row.frames.forEach((label, fi) => {
        const box = document.createElement('div');
        box.className = 'frame';
        const canvas = document.createElement('canvas');
        canvas.width = CELL * SCALE; canvas.height = CELL * SCALE;
        const ctx = canvas.getContext('2d');
        ctx.imageSmoothingEnabled = false;
        ctx.drawImage(img, fi * CELL, ri * CELL, CELL, CELL, 0, 0, CELL * SCALE, CELL * SCALE);
        const cap = document.createElement('div');
        cap.className = 'frame-label';
        cap.textContent = label;
        box.appendChild(canvas);
        box.appendChild(cap);
        frames.appendChild(box);
      });
      section.appendChild(frames);
      root.appendChild(section);
    });
  };
  img.src = SHEET;
</script>
</body>
</html>
