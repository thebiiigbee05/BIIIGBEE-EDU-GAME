    </filter>
  </defs>
  <!-- ขา -->
  <rect x="40" y="96" width="12" height="14" rx="4" fill="#0b0f2a" stroke="#39ff14" stroke-width="2"/>
  <rect x="76" y="96" width="12" height="14" rx="4" fill="#0b0f2a" stroke="#39ff14" stroke-width="2"/>
