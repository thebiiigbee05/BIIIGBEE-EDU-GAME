  <circle cx="64" cy="21" r="4.5" fill="#39ff14"/>
  <!-- ตา -->
  <circle cx="52" cy="62" r="9" fill="#ffffff"/>
  <circle cx="76" cy="62" r="9" fill="#ffffff"/>
  <circle cx="54" cy="64" r="4" fill="#0b0f2a"/>
  <circle cx="78" cy="64" r="4" fill="#0b0f2a"/>
